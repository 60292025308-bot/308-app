<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>特捜部：尋問室</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif;
      background: #0d1117; color: #c9d1d9;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 24px 16px 40px;
    }
    .header {
      width: 100%; max-width: 720px;
      background: linear-gradient(135deg, #161b22 0%, #1c2430 100%);
      border: 1px solid #30363d; border-top: 3px solid #c0392b;
      border-radius: 8px; padding: 18px 24px 16px; margin-bottom: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6); position: relative; overflow: hidden;
    }
    .header::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      pointer-events: none;
    }
    .title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .badge { background: #c0392b; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
    .title { font-size: 16px; font-weight: 700; color: #e6edf3; letter-spacing: 0.5px; }
    .meter-label-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .meter-label { font-size: 11px; color: #8b949e; letter-spacing: 1px; }
    .meter-value { font-size: 22px; font-weight: 700; color: #e74c3c; font-variant-numeric: tabular-nums; }
    .meter-track { width: 100%; height: 18px; background: #21262d; border-radius: 9px; border: 1px solid #30363d; overflow: hidden; }
    .meter-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #8b1a1a 0%, #c0392b 50%, #e74c3c 100%);
      border-radius: 9px; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); position: relative;
    }
    .meter-fill::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: rgba(255,255,255,0.08); border-radius: 9px 9px 0 0; }
    .case-file {
      width: 100%; max-width: 720px;
      background: #161b22; border: 1px solid #30363d; border-left: 4px solid #e67e22;
      border-radius: 6px; padding: 12px 16px; margin-bottom: 12px;
      display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px;
    }
    .case-file-header { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .case-number { font-size: 10px; color: #8b949e; letter-spacing: 1px; font-weight: 700; }
    .case-name { font-size: 15px; font-weight: 700; color: #e6edf3; }
    .case-label { color: #6e7681; white-space: nowrap; font-size: 12px; }
    .case-value { color: #c9d1d9; font-size: 12px; line-height: 1.5; }
    .case-value.highlight { color: #ffa657; font-weight: 600; }
    .stats-bar {
      width: 100%; max-width: 720px;
      display: flex; justify-content: space-between; align-items: center;
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      padding: 8px 16px; margin-bottom: 12px; font-size: 13px; color: #8b949e;
    }
    .remaining { color: #f0a500; font-weight: 700; font-size: 14px; }
    .remaining span { color: #ffd700; font-size: 18px; }
    .chat-section {
      width: 100%; max-width: 720px;
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 16px; margin-bottom: 12px; height: 360px;
      overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
    }
    .chat-section::-webkit-scrollbar { width: 6px; }
    .chat-section::-webkit-scrollbar-track { background: #0d1117; }
    .chat-section::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    .msg-suspect { display: flex; gap: 12px; align-items: flex-start; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid #30363d; }
    .avatar-suspect { background: #21262d; }
    .avatar-player  { background: #1a2a3a; border-color: #264f78; }
    .bubble-wrap { display: flex; flex-direction: column; gap: 3px; max-width: calc(100% - 58px); }
    .bubble-name { font-size: 11px; color: #8b949e; letter-spacing: 0.5px; }
    .bubble { padding: 10px 14px; font-size: 14px; line-height: 1.6; }
    .bubble-suspect { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 0 10px 10px 10px; }
    .msg-player { display: flex; gap: 12px; align-items: flex-start; flex-direction: row-reverse; }
    .msg-player .bubble-wrap { align-items: flex-end; }
    .bubble-player { background: #1a3a5c; border: 1px solid #264f78; color: #a8d4f5; border-radius: 10px 0 10px 10px; }
    .bubble-name-player { text-align: right; }
    .msg-system { text-align: center; font-size: 11px; color: #6e7681; font-style: italic; padding: 2px 0; }
    .input-section { width: 100%; max-width: 720px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; }
    .input-row { display: flex; gap: 10px; }
    .question-input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; padding: 10px 14px; font-family: inherit; outline: none; transition: border-color 0.2s; }
    .question-input::placeholder { color: #484f58; }
    .question-input:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88,166,255,0.1); }
    .question-input:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-interrogate { background: #c0392b; color: #fff; border: none; border-radius: 6px; padding: 10px 20px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap; letter-spacing: 0.5px; transition: background 0.2s, transform 0.1s; }
    .btn-interrogate:hover:not(:disabled) { background: #e74c3c; }
    .btn-interrogate:active:not(:disabled) { transform: scale(0.97); }
    .btn-interrogate:disabled { opacity: 0.4; cursor: not-allowed; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.80); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 36px 32px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 8px 48px rgba(0,0,0,0.8); animation: pop-in 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes pop-in { from { opacity: 0; transform: scale(0.85) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal-icon { font-size: 52px; margin-bottom: 10px; }
    .modal-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .modal-title.win  { color: #3fb950; }
    .modal-title.lose { color: #f85149; }
    .modal-body { font-size: 14px; color: #8b949e; line-height: 1.8; margin-bottom: 22px; }
    .modal-verdict { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px 14px; font-size: 13px; color: #8b949e; text-align: left; margin-bottom: 20px; line-height: 1.7; }
    .modal-verdict strong { color: #e6edf3; }
    .btn-modal { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 12px 28px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: background 0.2s; margin: 4px; }
    .btn-modal:hover { background: #2ea043; }
    .btn-gray { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
    .btn-gray:hover { background: #30363d; }
    .intro-overlay { display: none; position: fixed; inset: 0; background: #0d1117; z-index: 200; align-items: center; justify-content: center; padding: 20px; }
    .intro-overlay.active { display: flex; }
    .intro-box { max-width: 520px; width: 100%; padding: 40px 32px; text-align: center; }
    .intro-stamp { font-size: 11px; letter-spacing: 3px; color: #c0392b; font-weight: 700; margin-bottom: 28px; }
    .intro-case-name { font-size: 26px; font-weight: 700; color: #e6edf3; line-height: 1.4; margin-bottom: 10px; }
    .intro-sub { font-size: 13px; color: #6e7681; margin-bottom: 32px; line-height: 1.7; white-space: pre-line; }
    .btn-start { background: #c0392b; color: #fff; border: none; border-radius: 6px; padding: 14px 40px; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; letter-spacing: 1px; transition: background 0.2s; width: 100%; }
    .btn-start:hover { background: #e74c3c; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
    .shake { animation: shake 0.4s ease; }
    @keyframes pulse-red { 0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,0.4)} 50%{box-shadow:0 0 0 8px rgba(231,76,60,0)} }
    .meter-fill.bump { animation: pulse-red 0.7s ease; }
    /* 画面フラッシュ */
    .screen-flash { position: fixed; inset: 0; pointer-events: none; z-index: 999; opacity: 0; transition: opacity 0.08s; }
    .screen-flash.red   { background: rgba(192,57,43,0.18); }
    .screen-flash.white { background: rgba(255,255,255,0.12); }
    .screen-flash.on    { opacity: 1; }
  </style>
</head>
<body>

<div class="screen-flash" id="screen-flash"></div>

<!-- イントロ -->
<div class="intro-overlay active" id="intro-overlay">
  <div class="intro-box">
    <div class="intro-stamp">METROPOLITAN POLICE DEPT. — CASE FILE</div>
    <div class="intro-case-name" id="intro-case-name">事件名をロード中…</div>
    <div class="intro-sub" id="intro-sub"></div>
    <button class="btn-start" onclick="startGame()">尋問を開始する</button>
  </div>
</div>

<!-- ヘッダー -->
<div class="header">
  <div class="title-row">
    <span class="badge">CONFIDENTIAL</span>
    <span class="title" id="header-title">特捜部：尋問室</span>
  </div>
  <div class="meter-label-row">
    <span class="meter-label">🔴 自白メーター</span>
    <span class="meter-value" id="meter-value">0%</span>
  </div>
  <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
</div>

<!-- 事件ファイル -->
<div class="case-file">
  <div class="case-file-header">
    <span class="case-number" id="case-number">CASE #----</span>
    <span class="case-name" id="case-name-display">—</span>
  </div>
  <span class="case-label">発生日時</span><span class="case-value" id="cf-datetime">—</span>
  <span class="case-label">発生場所</span><span class="case-value" id="cf-location">—</span>
  <span class="case-label">被害・容疑</span><span class="case-value highlight" id="cf-damage">—</span>
  <span class="case-label">容疑者</span><span class="case-value" id="cf-suspect">—</span>
</div>

<!-- ステータスバー -->
<div class="stats-bar">
  <span>担当刑事：<strong style="color:#e6edf3">警部補 剛田 鉄也</strong></span>
  <span class="remaining">残り質問回数：<span id="remaining-count">10</span> 回</span>
</div>

<!-- チャットログ -->
<div class="chat-section" id="chat-log"></div>

<!-- 入力 -->
<div class="input-section">
  <div class="input-row">
    <input type="text" class="question-input" id="question-input" placeholder="容疑者に問い詰める言葉を入力…" maxlength="200" />
    <button class="btn-interrogate" id="btn-interrogate" onclick="handleInterrogate()">問い詰める</button>
  </div>
</div>

<!-- 勝利モーダル -->
<div class="modal-overlay" id="modal-win">
  <div class="modal">
    <div class="modal-icon">⚖️</div>
    <div class="modal-title win">自白成功！事件解決！</div>
    <div class="modal-body" id="win-body"></div>
    <div class="modal-verdict" id="win-verdict"></div>
    <button class="btn-modal" onclick="showNewCaseOrRetry(true)">次の事件へ</button>
    <button class="btn-modal btn-gray" onclick="showNewCaseOrRetry(false)">同じ事件をリトライ</button>
  </div>
</div>

<!-- 敗北モーダル -->
<div class="modal-overlay" id="modal-lose">
  <div class="modal">
    <div class="modal-icon">📁</div>
    <div class="modal-title lose">尋問失敗 — 迷宮入り</div>
    <div class="modal-body" id="lose-body"></div>
    <div class="modal-verdict" id="lose-verdict"></div>
    <button class="btn-modal" onclick="showNewCaseOrRetry(true)">別の事件を担当する</button>
    <button class="btn-modal btn-gray" onclick="showNewCaseOrRetry(false)">同じ事件をリトライ</button>
  </div>
</div>

<script>
// ============================================================
// Web Audio API — SE生成
// ============================================================
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(opts) {
  // opts: { type, freq, freq2, duration, attack, decay, volume, filter, filterFreq }
  try {
    const ctx  = getAudioCtx();
    const gain = ctx.createGain();
    const osc  = ctx.createOscillator();
    gain.connect(ctx.destination);
    osc.connect(gain);
    osc.type = opts.type || "sine";
    const now = ctx.currentTime;
    const vol = opts.volume || 0.4;
    osc.frequency.setValueAtTime(opts.freq || 440, now);
    if (opts.freq2) osc.frequency.exponentialRampToValueAtTime(opts.freq2, now + (opts.duration || 0.3));
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(vol, now + (opts.attack || 0.01));
    gain.gain.exponentialRampToValueAtTime(0.001, now + (opts.decay || opts.duration || 0.3));
    osc.start(now);
    osc.stop(now + (opts.duration || 0.3) + 0.05);
  } catch(e) {}
}

function playNoise(duration, volume, highpass) {
  try {
    const ctx    = getAudioCtx();
    const buf    = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
    const data   = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src    = ctx.createBufferSource();
    src.buffer   = buf;
    const filt   = ctx.createBiquadFilter();
    filt.type    = highpass ? "highpass" : "bandpass";
    filt.frequency.value = highpass || 800;
    const gain   = ctx.createGain();
    gain.gain.setValueAtTime(volume || 0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    src.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
    src.start(); src.stop(ctx.currentTime + duration + 0.05);
  } catch(e) {}
}

// SE定義
const SE = {
  // 問い詰めボタン押下：鈍い机ドン音
  interrogate() {
    playNoise(0.12, 0.5, 60);
    playTone({ type:"sine", freq:80, freq2:40, duration:0.15, attack:0.005, decay:0.15, volume:0.35 });
  },
  // strong（証拠）：緊張感のある不協和音
  strong() {
    playTone({ type:"sawtooth", freq:440, freq2:220, duration:0.25, attack:0.01, decay:0.25, volume:0.25 });
    setTimeout(() => playTone({ type:"square", freq:330, duration:0.2, attack:0.01, decay:0.2, volume:0.15 }), 80);
  },
  // core（事件核心）：低い警告音
  core() {
    playTone({ type:"sine", freq:220, freq2:180, duration:0.3, attack:0.02, decay:0.3, volume:0.3 });
  },
  // pressure（追及）：鋭いクリック
  pressure() {
    playTone({ type:"square", freq:600, freq2:400, duration:0.1, attack:0.005, decay:0.1, volume:0.2 });
  },
  // other：小さなペン置き音
  other() {
    playTone({ type:"triangle", freq:1200, duration:0.06, attack:0.003, decay:0.06, volume:0.12 });
  },
  // 自白・クライマックス
  confession() {
    [0, 120, 260, 420].forEach((t, i) => {
      setTimeout(() => {
        playTone({ type:"sawtooth", freq:110 + i*55, freq2:55, duration:0.4, attack:0.01, decay:0.4, volume:0.3 - i*0.04 });
        playNoise(0.3, 0.15, 200);
      }, t);
    });
  },
  // 勝利
  win() {
    [0,150,300,500].forEach((t,i) => {
      setTimeout(() => playTone({ type:"sine", freq:[523,659,784,1047][i], duration:0.35, attack:0.01, decay:0.35, volume:0.35 }), t);
    });
  },
  // 敗北
  lose() {
    [0,200,450].forEach((t,i) => {
      setTimeout(() => playTone({ type:"sine", freq:[300,240,180][i], duration:0.5, attack:0.02, decay:0.5, volume:0.3 }), t);
    });
  },
  // 残り少ない警告
  warning() {
    playTone({ type:"square", freq:880, freq2:660, duration:0.15, attack:0.005, decay:0.15, volume:0.2 });
    setTimeout(() => playTone({ type:"square", freq:880, freq2:660, duration:0.15, attack:0.005, decay:0.15, volume:0.2 }), 200);
  },
  // メーター上昇ビープ
  meterUp(inc) {
    const freq = inc >= 30 ? 660 : inc >= 15 ? 500 : 380;
    playTone({ type:"sine", freq, duration:0.12, attack:0.005, decay:0.12, volume:0.18 });
  }
};

// ============================================================
// 画面フラッシュ
// ============================================================
function flash(color) {
  const el = document.getElementById("screen-flash");
  el.className = `screen-flash ${color} on`;
  setTimeout(() => el.classList.remove("on"), 80);
  setTimeout(() => el.classList.remove(color), 200);
}

// ============================================================
// 応答ライブラリ
// phase: 0=序盤(0-33%), 1=中盤(34-66%), 2=終盤(67-99%)
// {W} = プレイヤー入力から抽出した単語
// ============================================================
const RESPONSE_LIB = {

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // ART-001 美術館・名画
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  "ART-001": {
    strong: [
      // 序盤
      ["そ、そのカメラの映像はシステム障害です！私は関係ない！",
       "偽造ですよ！その{W}は誰かに操作されている！",
       "指紋？私は警備員です。触れて当然でしょう！",
       "{W}の話は知らない。完全に知らない！",
       "証拠があるというなら見せてください。今すぐ！"],
      // 中盤
      ["……{W}が示す通りなら……（唇を噛む）いや、それでも違う！",
       "そのIPアドレスは……いや、私は……（目が泳ぐ）",
       "{W}の件は、誰かに利用された可能性が……（口ごもる）",
       "……少し、待ってください。（額に汗が滲む）その{W}、どこで入手した？",
       "……（拳を握り締める）{W}については、弁護士と相談してから答えます。"],
      // 終盤
      ["……（長い沈黙）{W}については……否定できません。",
       "もう……もう弁護士を呼んでください。それ以上は話せない。（手が震えている）",
       "{W}……その話をするなら、一つだけ言わせてください。私だけじゃないんです。",
       "……わかった。全部じゃないが、少しだけ話します。（視線を落とす）",
       "（深呼吸）……{W}の件は、確かに関わりました。でも、強制されたんです。"]
    ],
    core: [
      ["名画？あの絵なら30年間守り続けてきた！私がなぜ盗む必要があるんですか！",
       "展示室には入りましたよ、点検のために！深夜のルーティンです！",
       "贋作だと？……今はそんな話はしていない。あの絵は本物だった！",
       "{W}は知っている。30年この美術館にいれば誰でも知っている！",
       "あの絵の価値は私が一番わかっている……だからこそ守ってきたんです！"],
      ["……{W}の話は、少し、複雑なんです。（視線を逸らす）でも私は関係ない。",
       "あの{W}……確かに知っています。でもそれは仕事上の知識です！",
       "……展示室に入ったのは本当です。でもそれだけだ。それだけ！",
       "（声が低くなる）{W}については……答えたくない。",
       "あの絵の……あの絵のことを思うと……（目が潤む）いや、何でもない。"],
      ["……あの{W}は、美しかった。（呟くように）30年、毎日見てきたんです。",
       "（深呼吸）……{W}については、否定しません。ただ、全部私の意志じゃなかった。",
       "……8000万の借金が……あって……（声が詰まる）",
       "画商から持ちかけられた話を……断れなかった……",
       "……全部話す前に……家族には、知らせないでください。"]
    ],
    pressure: [

// ============================================================
// ゲーム状態
// ============================================================
const MAX_QUESTIONS = 10;
let currentCase        = null;
let confessionMeter    = 0;
let remainingQuestions = MAX_QUESTIONS;
let gameOver           = false;
let lastCaseId         = null;
let usedIdx            = {};

// ============================================================
// ユーティリティ
// ============================================================
function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function escapeHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function extractWord(text) {
  const m = text.match(/[\u3041-\u9FFF]{2,6}/g) || [];
  if (!m.length) return text.slice(0, 4) || "それ";
  return m.reduce((a, b) => a.length >= b.length ? a : b);
}

function getPhase() {
  if (confessionMeter < 34) return 0;
  if (confessionMeter < 67) return 1;
  return 2;
}

function pickResponse(caseId, category, phase, playerInput) {
  const pool = RESPONSE_LIB[caseId]?.[category]?.[phase]
            || RESPONSE_LIB[caseId]?.other?.[phase]
            || ["……（黙っている）"];
  const key = `${caseId}_${category}_${phase}`;
  if (!usedIdx[key]) usedIdx[key] = [];
  if (usedIdx[key].length >= pool.length) usedIdx[key] = [];
  const unused = pool.map((_,i)=>i).filter(i=>!usedIdx[key].includes(i));
  const idx    = unused[Math.floor(Math.random() * unused.length)];
  usedIdx[key].push(idx);
  const word = escapeHtml(extractWord(playerInput));
  return pool[idx].replace(/\{W\}/g, word);
}

// ============================================================
// DOM参照
// ============================================================
const chatLog        = document.getElementById("chat-log");
const meterFill      = document.getElementById("meter-fill");
const meterValueEl   = document.getElementById("meter-value");
const remainingEl    = document.getElementById("remaining-count");
const inputEl        = document.getElementById("question-input");
const btnInterrogate = document.getElementById("btn-interrogate");

// ============================================================
// チャットUI
// ============================================================
function appendSuspect(html) {
  const d = document.createElement("div");
  d.className = "msg-suspect";
  d.innerHTML = `<div class="avatar avatar-suspect">${currentCase.suspectEmoji}</div>
    <div class="bubble-wrap">
      <div class="bubble-name">${escapeHtml(currentCase.suspectName)}</div>
      <div class="bubble bubble-suspect">${html}</div>
    </div>`;
  chatLog.appendChild(d);
  chatLog.scrollTop = chatLog.scrollHeight;
  return d;
}

function appendSuspectRaw(text) {
  return appendSuspect(escapeHtml(text).replace(/\n/g,"<br>"));
}

function appendPlayer(text) {
  const d = document.createElement("div");
  d.className = "msg-player";
  d.innerHTML = `<div class="avatar avatar-player">🕵️</div>
    <div class="bubble-wrap">
      <div class="bubble-name bubble-name-player">警部補 剛田</div>
      <div class="bubble bubble-player">${escapeHtml(text)}</div>
    </div>`;
  chatLog.appendChild(d);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function appendSystem(text) {
  const d = document.createElement("div");
  d.className = "msg-system";
  d.textContent = text;
  chatLog.appendChild(d);
  chatLog.scrollTop = chatLog.scrollHeight;
}

// ============================================================
// メーター・カウンター
// ============================================================
function updateMeter(newVal) {
  confessionMeter = Math.min(100, Math.max(0, newVal));
  const pct = Math.round(confessionMeter);
  meterFill.style.width = pct + "%";
  meterValueEl.textContent = pct + "%";
  meterFill.classList.remove("bump");
  void meterFill.offsetWidth;
  meterFill.classList.add("bump");
  if (pct >= 80)      meterFill.style.background = "linear-gradient(90deg,#a93226 0%,#e74c3c 40%,#ff6b6b 100%)";
  else if (pct >= 50) meterFill.style.background = "linear-gradient(90deg,#922b21 0%,#c0392b 50%,#e74c3c 100%)";
  else                meterFill.style.background = "";
}

function updateRemaining() {
  remainingEl.textContent = remainingQuestions;
  if (remainingQuestions <= 3)      remainingEl.style.color = "#f85149";
  else if (remainingQuestions <= 5) remainingEl.style.color = "#ffa657";
  else                              remainingEl.style.color = "";
}

function setDisabled(v) { inputEl.disabled = v; btnInterrogate.disabled = v; }

// ============================================================
// キーワード分類
// ============================================================
function classify(text) {
  const kw = currentCase.keywords;
  for (const w of kw.strong)   { if (text.includes(w)) return "strong"; }
  for (const w of kw.core)     { if (text.includes(w)) return "core"; }
  for (const w of kw.pressure) { if (text.includes(w)) return "pressure"; }
  return "other";
}

// ============================================================
// メインロジック
// ============================================================
function handleInterrogate() {
  if (gameOver) return;
  const raw = inputEl.value.trim();
  if (!raw) {
    inputEl.focus();
    inputEl.style.borderColor = "#f85149";
    setTimeout(() => { inputEl.style.borderColor = ""; }, 700);
    return;
  }

  // SE：問い詰め
  SE.interrogate();

  remainingQuestions--;
  updateRemaining();
  appendPlayer(raw);
  inputEl.value = "";

  const cat   = classify(raw);
  const phase = getPhase();
  let inc = 0;

  switch (cat) {
    case "strong":
      inc = 30;
      SE.strong();
      flash("red");
      appendSystem("— 容疑者の表情が歪んだ —");
      break;
    case "core":
      inc = 15;
      SE.core();
      appendSystem("— 容疑者が一瞬言葉に詰まった —");
      break;
    case "pressure":
      inc = 10;
      SE.pressure();
      break;
    default:
      inc = 5;
      SE.other();
  }

  updateMeter(confessionMeter + inc);
  SE.meterUp(inc);

  // 残り少ない警告
  if (remainingQuestions <= 3 && remainingQuestions > 0) {
    setTimeout(() => SE.warning(), 300);
  }

  // アバターシェイク
  if (inc >= 30) {
    const avs = chatLog.querySelectorAll(".avatar-suspect");
    if (avs.length) {
      const a = avs[avs.length - 1];
      a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake");
    }
  }

  // 勝利チェック
  if (confessionMeter >= 100) {
    setTimeout(() => {
      SE.confession();
      flash("white");
      appendSuspectRaw(currentCase.confessionText);
      appendSystem("━━ 自白 ━━");
      gameOver = true;
      setDisabled(true);
      setTimeout(() => { SE.win(); showModal("win"); }, 1400);
    }, 350);
    return;
  }

  // 応答
  const delay = 400 + Math.random() * 300;
  setTimeout(() => {
    const reply = pickResponse(currentCase.id, cat, phase, raw);
    appendSuspect(reply.replace(/\n/g,"<br>"));

    if (remainingQuestions <= 0) {
      setTimeout(() => {
        appendSystem("━━ 尋問時間終了。容疑者は釈放された ━━");
        gameOver = true;
        setDisabled(true);
        SE.lose();
        setTimeout(() => showModal("lose"), 1000);
      }, 700);
    }
  }, delay);
}

// ============================================================
// モーダル
// ============================================================
function showModal(type) {
  if (type === "win") {
    document.getElementById("win-body").innerHTML    = escapeHtml(currentCase.suspectName) + "はついに全てを認めた。";
    document.getElementById("win-verdict").innerHTML = "<strong>捜査結果：</strong>" + escapeHtml(currentCase.winVerdict);
    document.getElementById("modal-win").classList.add("active");
  } else {
    document.getElementById("lose-body").innerHTML    = "証拠不十分で" + escapeHtml(currentCase.suspectName) + "は釈放された。";
    document.getElementById("lose-verdict").innerHTML = "<strong>捜査結果：</strong>" + escapeHtml(currentCase.loseVerdict);
    document.getElementById("modal-lose").classList.add("active");
  }
}

function showNewCaseOrRetry(newCase) {
  document.getElementById("modal-win").classList.remove("active");
  document.getElementById("modal-lose").classList.remove("active");
  if (newCase) pickAndShowIntro(true);
  else         startGame();
}

// ============================================================
// 事件選択・ゲーム初期化
// ============================================================
function pickAndShowIntro(avoidLast) {
  let pool = CASES;
  if (avoidLast && CASES.length > 1) pool = CASES.filter(c => c.id !== lastCaseId);
  currentCase = getRandom(pool);
  lastCaseId  = currentCase.id;
  document.getElementById("intro-case-name").textContent = currentCase.name;
  document.getElementById("intro-sub").textContent       = currentCase.intro;
  document.getElementById("intro-overlay").classList.add("active");
}

function startGame() {
  document.getElementById("intro-overlay").classList.remove("active");
  confessionMeter    = 0;
  remainingQuestions = MAX_QUESTIONS;
  gameOver           = false;
  usedIdx            = {};
  meterFill.style.width      = "0%";
  meterFill.style.background = "";
  meterValueEl.textContent   = "0%";
  updateRemaining();
  document.getElementById("header-title").textContent      = "特捜部：" + currentCase.name + "・尋問室";
  document.title                                           = "特捜部：" + currentCase.name;
  document.getElementById("case-number").textContent       = "CASE #" + currentCase.id;
  document.getElementById("case-name-display").textContent = currentCase.name;
  document.getElementById("cf-datetime").textContent       = currentCase.datetime;
  document.getElementById("cf-location").textContent       = currentCase.location;
  document.getElementById("cf-damage").textContent         = currentCase.damage;
  document.getElementById("cf-suspect").textContent        = currentCase.suspectName + "　／　" + currentCase.suspectRole;
  chatLog.innerHTML = "";
  setDisabled(false);
  appendSystem("━━ CASE " + currentCase.id + "　尋問開始 ━━");
  appendSuspectRaw(currentCase.openingLine);
  inputEl.focus();
}

document.getElementById("question-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleInterrogate(); }
});

pickAndShowIntro(false);
</script>
